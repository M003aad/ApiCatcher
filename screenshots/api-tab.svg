<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">ApiCatcher API tab mockup</title>
  <desc id="desc">A mock screenshot of the ApiCatcher panel showing captured JSON API responses.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#181a1f"/>
      <stop offset="100%" stop-color="#1f232b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="760" fill="#0f1115"/>
  <rect x="150" y="80" width="900" height="600" rx="18" fill="url(#bg)" stroke="#353b45"/>
  <rect x="150" y="80" width="900" height="52" rx="18" fill="#22252c" stroke="#353b45"/>
  <text x="185" y="113" font-family="Segoe UI, sans-serif" font-size="26" font-weight="600" fill="#f5f7fa">ApiCatcher</text>
  <rect x="1020" y="94" width="18" height="18" rx="4" fill="#303541"/>
  <text x="1047" y="111" font-family="Segoe UI, sans-serif" font-size="18" fill="#a7b3c7">1</text>
  <rect x="150" y="132" width="900" height="48" fill="#1e2127" stroke="#343842"/>
  <rect x="170" y="146" width="190" height="22" rx="11" fill="#2a303b"/>
  <text x="188" y="162" font-family="Segoe UI, sans-serif" font-size="14" fill="#e8edf7">API Requests</text>
  <text x="359" y="162" font-family="Segoe UI, sans-serif" font-size="13" fill="#a6afbf">1</text>
  <rect x="370" y="146" width="190" height="22" rx="11" fill="#1e2127"/>
  <text x="402" y="162" font-family="Segoe UI, sans-serif" font-size="14" fill="#8d97a8">Cookies</text>
  <text x="515" y="162" font-family="Segoe UI, sans-serif" font-size="13" fill="#a6afbf">0</text>
  <rect x="150" y="180" width="900" height="500" fill="#181a1f"/>
  <rect x="170" y="205" width="860" height="68" rx="10" fill="#232831" stroke="#2d343d"/>
  <rect x="190" y="220" width="62" height="24" rx="8" fill="#1a2635"/>
  <text x="212" y="238" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#61dafb">GET</text>
  <text x="270" y="238" font-family="Segoe UI, sans-serif" font-size="16" fill="#dfe7f7">/api/profile</text>
  <text x="720" y="238" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#98c379">200</text>
  <rect x="175" y="300" width="850" height="210" rx="10" fill="#11141a" stroke="#2d343d"/>
  <text x="196" y="332" font-family="Consolas, monospace" font-size="14" fill="#f1f1f1">{</text>
  <text x="196" y="356" font-family="Consolas, monospace" font-size="14" fill="#c5d5f1">  "id": 42,</text>
  <text x="196" y="380" font-family="Consolas, monospace" font-size="14" fill="#c5d5f1">  "name": "Ada",</text>
  <text x="196" y="404" font-family="Consolas, monospace" font-size="14" fill="#c5d5f1">  "role": "developer"</text>
  <text x="196" y="428" font-family="Consolas, monospace" font-size="14" fill="#f1f1f1">}</text>
  <rect x="175" y="520" width="850" height="42" rx="8" fill="#252932" stroke="#2d343d"/>
  <text x="196" y="547" font-family="Segoe UI, sans-serif" font-size="15" fill="#c7d1df">Copy</text>
